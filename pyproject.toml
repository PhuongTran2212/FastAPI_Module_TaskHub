[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [".worktrees", "venv", "alembic/versions/5857005dfb78_create_taskhub_tables.py", "alembic/versions/0d97a0968e0b_fix_foreign_keys_and_unique_constraint_.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
files = ["app", "scripts"]
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
