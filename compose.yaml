name: taskhub

x-app: &app
  build: .
  image: taskhub-local:day7
  init: true
  environment: &app-env
    DATABASE_URL: postgresql+asyncpg://taskhub:${POSTGRES_PASSWORD:-taskhub_dev}@db:5432/taskhub
    JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set a private JWT_SECRET_KEY in .env}
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/1
    TASK_CACHE_ENABLED: "true"
    ASSIGNMENT_EMAIL_ENABLED: "true"
    SMTP_HOST: mailpit
    SMTP_PORT: "1025"
    SMTP_FROM_EMAIL: taskhub@example.com
    SMTP_SECURITY: none
    REFRESH_CLEANUP_INTERVAL_SECONDS: ${REFRESH_CLEANUP_INTERVAL_SECONDS:-300}
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: taskhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskhub_dev}
      POSTGRES_DB: taskhub
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U taskhub -d taskhub"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    command: [redis-server, --appendonly, "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27.4
    ports:
      - "127.0.0.1:8025:8025"

  migrate:
    <<: *app
    command: [python, -m, alembic, upgrade, head]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    <<: *app
    command: [celery, -A, "app.core.celery_app:celery_app", worker, --loglevel=INFO, --concurrency=2]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: [CMD-SHELL, "celery -A app.core.celery_app:celery_app inspect ping --destination celery@$$HOSTNAME --timeout 2"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 10s

  beat:
    <<: *app
    command: [celery, -A, "app.core.celery_app:celery_app", beat, --loglevel=INFO, --schedule=/tmp/celerybeat-schedule]

volumes:
  postgres-data:
  redis-data:
